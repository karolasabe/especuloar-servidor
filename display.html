let ultimaPintitaId = 0;

async function inicializar() {
  try {
    const res = await fetch(`${API_BASE}/pintitas_recientes?n=4000`);
    const data = await res.json();
    totalRelatos = data.length > 0 ? Math.max(64, Math.round(data.length / 3.5)) : 64;
    data.reverse();
    for (const p of data) {
      if (!pintitasMap.has(p.id)) {
        pintitas.push(new Pintita(p.id, p.respuesta_id, p.categoria, false));
        pintitasMap.set(p.id, true);
        if (p.id > ultimaPintitaId) ultimaPintitaId = p.id;
      }
    }
    registrarConceptos(data.slice(-60), false);
    iniciarFlujoConceptos();
    actualizarEstado();
    setTimeout(ajustarCamaraInicial, 100);
  } catch(e) {
    console.error(e);
    marcarSinConexion();
  }
}

async function consultarNuevas() {
  try {
    const res = await fetch(`${API_BASE}/pintitas_recientes?n=100`);
    const data = await res.json();
    const nuevas = data.filter(p => p.id > ultimaPintitaId);
    nuevas.reverse();
    // Agrupar por relato: un relato genera varias pintitas (una por
    // categoría activada). El sub-pulso grave suena una vez por relato;
    // cada pintita entra escalonada con su propio armónico de la serie
    // (231 x n), su destello supernova y su ráfaga de conceptos.
    const porRespuesta = new Map();
    for (const p of nuevas) {
      if (!pintitasMap.has(p.id)) {
        if (!porRespuesta.has(p.respuesta_id)) porRespuesta.set(p.respuesta_id, []);
        porRespuesta.get(p.respuesta_id).push(p);
      }
    }
    for (const [respId, grupo] of porRespuesta) {
      const delayBase = Math.random() * 1200;
      // Golpe físico grave: anuncia la llegada del relato
      setTimeout(() => subPulsoIngreso(), delayBase);
      grupo.forEach((p, i) => {
        // Serie armónica de Dayvid: cada pintita toma el siguiente
        // armónico (231 x n), ciclando del 1 al 16
        const armN = 1 + (contadorIngresos % ARMONICOS_SERIE);
        contadorIngresos++;
        const delay = delayBase + 400 + i * 350;
        setTimeout(() => {
          const nueva = new Pintita(p.id, p.respuesta_id, p.categoria, true);
          pintitas.push(nueva);
          pintitasMap.set(p.id, true);
          swellIngreso(armN);
          dispararFlash(nueva);
          registrarConceptos([p], true);
        }, delay);
        if (p.id > ultimaPintitaId) ultimaPintitaId = p.id;
      });
    }
    actualizarEstado();
  } catch(e) { marcarSinConexion(); }
}

async function actualizarEstado() {
  try {
    const res = await fetch(`${API_BASE}/estado`);
    const data = await res.json();
    totalRelatos = data.total_respuestas || totalRelatos;
    if (data.pintitas?.length) actualizarCategoriaAudio(data.pintitas[0].categoria);
    document.getElementById('n-respuestas').textContent = data.total_respuestas;
    document.getElementById('estado-dot').classList.add('vivo');
    document.getElementById('estado-texto').textContent = 'corpus activo';
  } catch(e) { marcarSinConexion(); }
}

function marcarSinConexion() {
  document.getElementById('estado-dot').classList.remove('vivo');
  document.getElementById('estado-texto').textContent = 'sin conexión';
}

iniciarFlujoConceptos();
inicializar();
setInterval(consultarNuevas, POLL_INTERVAL);

// ============================================================
// MOVIMIENTO DEL CELULAR
// ============================================================
let motionActivo = false;
let motionSolicitado = false;
let ultimoShake = 0;

function desordenarPorShake(intensidad) {
  const centroX = hoverWorldX ?? 0;
  const centroY = hoverWorldY ?? 0;
  const radio = getWorldRadius() * 1.2;
  for (const p of pintitas) {
    const dx = p.x - centroX;
    const dy = p.y - centroY;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const cerca = Math.max(0.18, 1 - d / radio);
    const a = Math.random() * Math.PI * 2;
    const m = intensidad * cerca * (0.55 + Math.random() * 0.85);
    p.vx += Math.cos(a) * m;
    p.vy += Math.sin(a) * m;
    p.tiempoAgitacion = DURACION_AGITACION;
  }
}

function activarMovimientoCelular() {
  if (motionActivo || typeof DeviceMotionEvent === 'undefined') return;
  motionActivo = true;
  window.addEventListener('devicemotion', (e) => {
    const acc = e.accelerationIncludingGravity || e.acceleration;
    if (!acc) return;
    const ax = acc.x || 0;
    const ay = acc.y || 0;
    const az = acc.z || 0;
    const mag = Math.sqrt(ax * ax + ay * ay + az * az);
    const ahora = performance.now();
    if (mag > 16.2 && ahora - ultimoShake > 260) {
      ultimoShake = ahora;
      desordenarPorShake(Math.min(2.2, (mag - 13.5) * 0.095));
    }
  }, { passive: true });
}

async function prepararMovimientoCelular() {
  if (motionActivo || motionSolicitado || typeof DeviceMotionEvent === 'undefined') return;
  motionSolicitado = true;
  try {
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      const permiso = await DeviceMotionEvent.requestPermission();
      if (permiso === 'granted') activarMovimientoCelular();
    } else {
      activarMovimientoCelular();
    }
  } catch(e) {
    // Algunos navegadores bloquean sensores en HTTP; la interacción táctil sigue activa.
  }
}

// ============================================================
// MODO PROYECCIÓN : cliente WebSocket de gestos corporales
// Activar con: display.html?modo=proyeccion
// Requiere gesto_servidor.py corriendo en ws://localhost:8765
// Combinable con audio: display.html?modo=proyeccion&audio=on
// ============================================================
const MODO_PROYECCION = new URLSearchParams(window.location.search).get('modo') === 'proyeccion';

if (MODO_PROYECCION) {
  document.body.style.cursor = 'none';
  window.abrirRelato = async () => {};

  // Bloquear interacción directa: en proyección manda el cuerpo
  ['mousedown','mousemove','mouseup','mouseleave',
   'touchstart','touchmove','touchend',
   'pointerdown','pointermove','pointerup','pointercancel'].forEach(tipo =>
    window.addEventListener(tipo, e => e.stopPropagation(), true)
  );

  // Indicador de estado (esquina inferior derecha)
  const indicador = document.createElement('div');
  indicador.style.cssText = `
    position: fixed; bottom: 1.8rem; right: 1.8rem; z-index: 99;
    display: flex; align-items: center; gap: 7px;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.12em; color: #444; pointer-events: none;
  `;
  indicador.innerHTML = `
    <span id="gs-dot" style="width:5px;height:5px;border-radius:50%;
      background:#1a1a1a;display:inline-block;transition:background 0.3s"></span>
    <span id="gs-txt">gestos</span>`;
  document.body.appendChild(indicador);

  function setEstado(color, texto) {
    const d = document.getElementById('gs-dot');
    const t = document.getElementById('gs-txt');
    if (d) { d.style.background = color; d.style.boxShadow = color !== '#1a1a1a' ? `0 0 7px ${color}99` : 'none'; }
    if (t) t.textContent = texto;
  }

  // Parámetros de mapeo (ajustables sin tocar la lógica de partículas)
  const MAPA = {
    dispersionBase:     0.55,
    velocidadAmp:       2.2,
    inclinacionOffset:  0.14,
    alturaOffset:       0.28,
    radioDistancia:     1.8,
  };

  // Último estado recibido (suavizado para evitar saltos)
  let g = { activo: false, cx: 0.5, cy: 0.5, distancia: 0.5,
            apertura: 0, altura_brazos: 0.3, velocidad: 0, inclinacion: 0 };
  let gPrev = { ...g };
  const LERP = 0.28;

  function lerpVal(a, b, t) { return a + (b - a) * t; }

  function aplicarGesto(raw) {
    if (!raw.activo) {
      if (gesto.activo) {
        gesto.dispersion *= 0.85;
        gesto.jitter     *= 0.85;
        if (gesto.dispersion < 0.01) soltarGesto();
      }
      setEstado('#C4943D', 'sin cuerpo');
      return;
    }

    setEstado('#1D9E75', 'cuerpo activo');

    g.cx            = lerpVal(gPrev.cx,            raw.cx,            LERP);
    g.cy            = lerpVal(gPrev.cy,            raw.cy,            LERP);
    g.distancia     = lerpVal(gPrev.distancia,     raw.distancia,     LERP);
    g.apertura      = lerpVal(gPrev.apertura,      raw.apertura,      LERP);
    g.altura_brazos = lerpVal(gPrev.altura_brazos, raw.altura_brazos, LERP);
    g.velocidad     = lerpVal(gPrev.velocidad,     raw.velocidad,     LERP * 0.6);
    g.inclinacion   = lerpVal(gPrev.inclinacion,   raw.inclinacion,   LERP);
    gPrev = { ...g };

    const sx = (g.cx + g.inclinacion * MAPA.inclinacionOffset) * W;
    const sy = (g.cy - (g.altura_brazos - 0.3) * MAPA.alturaOffset) * H;

    const usarTactil = g.distancia > 0.35;
    actualizarGesto(sx, sy, true, false, usarTactil);

    gesto.dispersion = Math.min(1, gesto.dispersion + g.apertura * MAPA.dispersionBase);

    mouseVel = Math.min(4, mouseVel + g.velocidad * MAPA.velocidadAmp);
    ultimoMouseTime = performance.now();

    hoverWorldX = gesto.x;
    hoverWorldY = gesto.y;
  }

  function conectarWS() {
    setEstado('#C4943D', 'conectando');
    const ws = new WebSocket('ws://localhost:8765');

    ws.onopen = () => {
      setEstado('#C4943D', 'sin cuerpo');
      console.log('[proyección] WebSocket conectado');
    };

    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        aplicarGesto(data);
      } catch (err) {
        console.warn('[proyección] mensaje inválido:', err);
      }
    };

    ws.onclose = () => {
      setEstado('#8B0000', 'sin servidor');
      console.warn('[proyección] WebSocket cerrado : reintentando en 3s');
      soltarGesto();
      setTimeout(conectarWS, 3000);
    };

    ws.onerror = (err) => {
      console.error('[proyección] WebSocket error:', err);
      ws.close();
    };
  }

  conectarWS();
}
