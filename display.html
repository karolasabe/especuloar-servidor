<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Espéculo(ar)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital@0;1&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #09050a; }
  body { font-family: 'Space Mono', monospace; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    padding: 1.8rem;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .header-bar { display: flex; justify-content: space-between; align-items: flex-start; }
  .titulo { font-size: 11px; letter-spacing: 0.2em; color: #555; }
  .subtitulo { font-size: 10px; letter-spacing: 0.1em; color: #333; margin-top: 5px; font-style: italic; }
  .contador { text-align: right; }
  .n-respuestas { font-size: 38px; font-weight: 300; color: #888; line-height: 1; }
  .n-label { font-size: 9px; color: #444; letter-spacing: 0.2em; margin-top: 3px; }

  .footer-bar { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 0.8rem; }
  .controles-obra { display: flex; align-items: flex-end; gap: 0.55rem; pointer-events: auto; }
  .leyenda-toggle {
    display: block; pointer-events: auto; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%; border: 0;
    flex: 0 0 auto; position: relative; overflow: visible;
    background: transparent;
    isolation: isolate;
    transform: translateZ(0);
  }
  .leyenda-toggle::before,
  .leyenda-toggle::after {
    content: ""; position: absolute; border-radius: 50%;
    pointer-events: none;
  }
  .leyenda-toggle::before {
    inset: 4px;
    background:
      radial-gradient(circle at 36% 22%, rgba(255,229,158,0.94) 0 10%, rgba(232,147,90,0.68) 24%, transparent 50%),
      radial-gradient(circle at 66% 35%, rgba(245,221,44,0.62) 0 10%, rgba(212,132,122,0.72) 30%, transparent 58%),
      radial-gradient(circle at 32% 70%, rgba(184,20,232,0.78) 0 12%, rgba(46,196,216,0.50) 33%, transparent 62%),
      radial-gradient(circle at 72% 74%, rgba(232,170,142,0.88) 0 15%, rgba(255,36,36,0.34) 38%, transparent 64%),
      radial-gradient(circle at 52% 52%, rgba(238,231,220,0.40) 0 20%, rgba(158,158,158,0.24) 42%, transparent 72%);
    filter: blur(4.8px) saturate(1.16) contrast(1.08);
    box-shadow:
      inset -7px -8px 12px rgba(8,8,12,0.36),
      inset 5px 5px 10px rgba(255,255,255,0.18),
      0 0 13px rgba(245,221,44,0.10),
      0 0 22px rgba(46,196,216,0.15);
    opacity: 0.96;
    mix-blend-mode: screen;
  }
  .leyenda-toggle::after {
    inset: -7px;
    background:
      radial-gradient(circle at 42% 38%, rgba(245,221,44,0.18), transparent 34%),
      radial-gradient(circle at 60% 64%, rgba(46,196,216,0.18), transparent 42%),
      radial-gradient(circle at 34% 70%, rgba(184,20,232,0.16), transparent 44%),
      radial-gradient(circle, rgba(255,255,255,0.08), transparent 57%);
    filter: blur(8px);
    opacity: 0.78;
    z-index: -1;
  }
  body.leyenda-abierta .leyenda-toggle::before {
    filter: blur(4.2px) saturate(1.24) contrast(1.12) brightness(1.08);
    opacity: 1;
  }

  /* BOTON DE AUDIO
     Misma esfera nebulosa que el toggle de categorias, con un glifo
     de ondas sonoras (punto central + arcos concentricos simetricos).
     Apagado: esfera gris inerte, glifo tenue.
     Activo: esfera con los colores del sistema, glifo brillante,
     respiracion lenta de 4.5 segundos. */
  .audio-toggle {
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%; border: 0;
    flex: 0 0 auto; position: relative; overflow: visible;
    background: transparent;
    isolation: isolate;
    transform: translateZ(0);
    color: rgba(205,200,192,0.52);
    transition: color 0.35s ease;
  }
  .audio-toggle svg {
    position: relative; z-index: 1;
    width: 21px; height: 21px;
    display: block;
  }
  .audio-toggle svg path {
    fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round;
  }
  .audio-toggle svg circle { fill: currentColor; }
  .audio-toggle::before,
  .audio-toggle::after {
    content: ""; position: absolute; border-radius: 50%;
    pointer-events: none;
  }
  .audio-toggle::before {
    inset: 4px;
    background:
      radial-gradient(circle at 40% 30%, rgba(180,178,172,0.30) 0 12%, transparent 46%),
      radial-gradient(circle at 64% 62%, rgba(158,158,158,0.22) 0 16%, transparent 52%),
      radial-gradient(circle at 50% 50%, rgba(120,118,115,0.16) 0 24%, transparent 66%);
    filter: blur(4.8px) saturate(0.4);
    box-shadow:
      inset -7px -8px 12px rgba(8,8,12,0.36),
      inset 5px 5px 10px rgba(255,255,255,0.08);
    opacity: 0.6;
    mix-blend-mode: screen;
    transition: opacity 0.35s ease, filter 0.35s ease;
  }
  .audio-toggle::after {
    inset: -7px;
    background: radial-gradient(circle, rgba(158,158,158,0.10), transparent 57%);
    filter: blur(8px);
    opacity: 0.4;
    z-index: -1;
    transition: opacity 0.35s ease, background 0.35s ease;
  }
  body.audio-activo .audio-toggle {
    color: rgba(255,240,206,0.95);
    filter: drop-shadow(0 0 5px rgba(245,221,44,0.35));
  }
  body.audio-activo .audio-toggle::before {
    background:
      radial-gradient(circle at 36% 22%, rgba(255,229,158,0.90) 0 10%, rgba(232,147,90,0.62) 24%, transparent 50%),
      radial-gradient(circle at 66% 38%, rgba(245,221,44,0.55) 0 10%, rgba(212,132,122,0.62) 30%, transparent 58%),
      radial-gradient(circle at 34% 70%, rgba(184,20,232,0.62) 0 12%, rgba(46,196,216,0.44) 33%, transparent 62%),
      radial-gradient(circle at 70% 74%, rgba(232,170,142,0.72) 0 15%, transparent 60%);
    filter: blur(4.8px) saturate(1.18) contrast(1.08);
    box-shadow:
      inset -7px -8px 12px rgba(8,8,12,0.36),
      inset 5px 5px 10px rgba(255,255,255,0.16),
      0 0 13px rgba(245,221,44,0.12),
      0 0 22px rgba(46,196,216,0.16);
    opacity: 0.96;
    animation: audioRespira 4.5s ease-in-out infinite;
  }
  body.audio-activo .audio-toggle::after {
    background:
      radial-gradient(circle at 45% 40%, rgba(245,221,44,0.16), transparent 38%),
      radial-gradient(circle at 58% 62%, rgba(46,196,216,0.16), transparent 44%),
      radial-gradient(circle, rgba(255,255,255,0.07), transparent 57%);
    opacity: 0.75;
  }
  @keyframes audioRespira {
    0%, 100% { transform: scale(1); opacity: 0.96; }
    50% { transform: scale(1.045); opacity: 1; }
  }

  /* COLUMNA DE CONCEPTOS (flujo continuo, costado derecho)
     Terminos semanticos del corpus con estetica terminal:
     tokens numerados, colores por categoria, mascara de gradiente. */
  .conceptos-flujo {
    position: fixed; top: 4.9rem; right: 1.35rem; bottom: 4.9rem;
    width: 330px;
    max-width: calc(100vw - 2.7rem);
    display: flex; flex-direction: column; align-items: flex-start; gap: 0.02rem;
    overflow: hidden; pointer-events: none; z-index: 3;
    mix-blend-mode: normal;
    padding-left: 0.65rem;
    border-left: 0.5px solid rgba(220,210,198,0.13);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 5%, #000 93%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 5%, #000 93%, transparent 100%);
  }
  .concepto-token {
    display: block;
    max-width: 100%;
    font-size: 9.5px; line-height: 1.06; letter-spacing: 0.07em;
    text-transform: lowercase; white-space: nowrap;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    opacity: 0; filter: none;
    text-shadow: 0 0 3px currentColor;
    transform: translateX(0) translateY(-4px);
    animation: concepto-aparece var(--vida, 9400ms) linear forwards;
  }
  @keyframes concepto-aparece {
    0% {
      opacity: 0;
      filter: none;
      transform: translateY(-4px);
    }
    7% {
      opacity: var(--alpha, 0.72);
      filter: none;
    }
    72% {
      opacity: var(--alpha, 0.72);
    }
    100% {
      opacity: 0;
      filter: none;
      transform: translateY(18px);
    }
  }

  .leyenda {
    position: absolute; left: 1.8rem; bottom: 5.35rem;
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    max-width: min(78vw, 760px);
    padding: 0.85rem 1rem;
    background: rgba(5,5,7,0.58);
    border: 0.5px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(12px);
    opacity: 0; transform: translateY(8px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  body.leyenda-abierta .leyenda {
    opacity: 1; transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .leyenda-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 9px; color: #777; letter-spacing: 0.04em;
    cursor: pointer; user-select: none; padding: 3px 2px;
    transition: opacity 0.25s, color 0.25s;
  }
  .leyenda-item:hover { color: #bbb; }
  .leyenda-item.apagado { opacity: 0.28; }
  .leyenda-dot { width: 8px; height: 8px; border-radius: 50%; transition: opacity 0.25s; flex-shrink: 0; }

  .estado { text-align: right; }
  .estado-dot { width: 5px; height: 5px; border-radius: 50%; background: #1a1a1a; display: inline-block; margin-right: 5px; vertical-align: middle; }
  .estado-dot.vivo { background: #1D9E75; box-shadow: 0 0 6px rgba(29,158,117,0.5); }
  .estado-texto { font-size: 9px; color: #444; letter-spacing: 0.12em; }

  .zoom-hint {
    position: fixed; bottom: 3.35rem; left: 50%;
    transform: translateX(-50%);
    font-size: 9px; color: rgba(180,160,140,0.38); letter-spacing: 0.15em;
    pointer-events: none; z-index: 3;
  }

  #modal {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    background: rgba(3,3,3,0.9); padding: 2rem;
    backdrop-filter: blur(10px);
  }
  #modal.activo { display: flex; }
  .modal-contenido {
    background: #0a0a0a; border: 0.5px solid #1e1e1e;
    max-width: 600px; width: 100%; padding: 2.5rem;
    max-height: 80vh; overflow-y: auto;
    color: #ccc; font-family: 'Space Mono', monospace;
    font-size: 13.5px; line-height: 1.75; position: relative;
  }
  .modal-categorias { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.4rem; }
  .modal-cat-chip { font-size: 9.5px; padding: 3px 9px; border-radius: 10px; color: #fff; letter-spacing: 0.04em; }
  .modal-relato { white-space: pre-wrap; color: #d8d8d8; }
  .modal-cerrar {
    position: absolute; top: 1rem; right: 1.4rem;
    background: transparent; border: none; color: #555;
    font-size: 11px; cursor: pointer; font-family: inherit; letter-spacing: 0.1em;
  }
  .modal-cerrar:hover { color: #ccc; }
  .modal-traducir {
    display: none; margin-top: 1.4rem;
    background: none; border: none;
    color: rgba(255,255,255,0.28); font-size: 9px;
    letter-spacing: 0.14em; cursor: pointer;
    font-family: 'Space Mono', monospace;
    padding: 0; transition: color 0.2s;
  }
  .modal-traducir:hover { color: rgba(255,255,255,0.6); }

  @media (max-width: 640px) {
    #overlay { padding: 1.1rem; }
    .n-respuestas { font-size: 28px; }
    .footer-bar { align-items: flex-end; }
    .controles-obra { gap: 0.35rem; }
    .leyenda {
      position: absolute; left: 1.1rem; bottom: 4.8rem;
      max-width: min(84vw, 360px); gap: 5px 9px;
      padding: 0.8rem 0.9rem;
    }
    .leyenda-item { font-size: 7.2px; gap: 4px; padding: 2px 0; line-height: 1.15; color: rgba(220,210,198,0.62); }
    .leyenda-dot { width: 7px; height: 7px; }
    .estado-texto { color: rgba(220,210,198,0.54); }
    .conceptos-flujo {
      top: 5.0rem; right: 0.7rem; bottom: 5.0rem;
      width: 198px; max-width: 52vw; gap: 0;
      padding-left: 0.45rem;
    }
    .concepto-token {
      font-size: 7.2px; line-height: 1.02; letter-spacing: 0.04em;
      text-shadow: 0 0 2px currentColor;
    }
    .zoom-hint { display: none; }
    .modal-contenido { padding: 1.4rem; font-size: 12.5px; }
  }
</style>
</head>
<body>
<canvas id="lienzo" aria-label="Galaxia colectiva de Espéculo(ar)"></canvas>

<div id="overlay">
  <div class="header-bar">
    <div>
      <div class="titulo">ESPÉCULO(AR)</div>
      <div class="subtitulo">galaxia colectiva</div>
    </div>
    <div class="contador">
      <div class="n-respuestas" id="n-respuestas">—</div>
      <div class="n-label">VOCES</div>
    </div>
  </div>
  <div class="footer-bar">
    <div class="controles-obra">
      <button class="leyenda-toggle" id="leyenda-toggle" type="button" aria-label="mostrar categorías" aria-expanded="false"></button>
      <button class="audio-toggle" id="audio-toggle" type="button" aria-label="activar sonido" aria-pressed="false" title="sonido">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="1.9"/>
          <path d="M15.9 8.9a4.9 4.9 0 0 1 0 6.2"/>
          <path d="M18.6 6.6a8.6 8.6 0 0 1 0 10.8"/>
          <path d="M8.1 8.9a4.9 4.9 0 0 0 0 6.2"/>
          <path d="M5.4 6.6a8.6 8.6 0 0 0 0 10.8"/>
        </svg>
      </button>
    </div>
    <div class="leyenda" id="leyenda"></div>
    <div class="estado">
      <span class="estado-dot" id="estado-dot"></span>
      <span class="estado-texto" id="estado-texto">conectando</span>
    </div>
  </div>
</div>

<div class="conceptos-flujo" id="conceptos-flujo" aria-hidden="true"></div>

<div class="zoom-hint">agita el cursor para revelar relatos · pellizca / rueda para zoom · arrastra para mover</div>

<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-contenido">
    <button class="modal-cerrar" onclick="cerrarModal()">cerrar</button>
    <div class="modal-categorias" id="modal-cats"></div>
    <div class="modal-relato" id="modal-texto"></div>
    <button class="modal-traducir" id="modal-traducir" onclick="toggleTraduccion()">ver en español</button>
  </div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
// API_BASE: el servidor de API vive en Render. Esta página se sirve como
// archivo estático desde GitHub Pages (otro origen distinto al de la API).
// En red local (localhost / IP privada) usa el Flask local; abierta como
// archivo usa 127.0.0.1:5000; en cualquier otro caso, Render.
const RENDER_API = 'https://especuloar-servidor.onrender.com';
const _host = window.location.hostname;
const _esRedLocal =
  ['localhost', '127.0.0.1'].includes(_host) ||
  /^192\.168\./.test(_host) ||
  /^10\./.test(_host) ||
  /^172\.(1[6-9]|2\d|3[01])\./.test(_host);
const API_BASE = (_esRedLocal && window.location.protocol.startsWith('http'))
    ? window.location.origin
    : (window.location.protocol === 'file:' ? 'http://127.0.0.1:5000' : RENDER_API);
const POLL_INTERVAL = 5000;

const CATEGORIAS = {
  'dolor_fisico':          { color: '#FF2424', nombre: 'Dolor físico' },
  'miedo':                 { color: '#A01F35', nombre: 'Miedo' },
  'verguenza_exposicion':  { color: '#C4943D', nombre: 'Vergüenza / exposición' },
  'sensaciones_frias':     { color: '#2EC4D8', nombre: 'Sensaciones frías' },
  'sensaciones_calidas':   { color: '#E8935A', nombre: 'Sensaciones cálidas' },
  'sonido':                { color: '#6BBF8A', nombre: 'Sonido / acústica' },
  'aromas':                { color: '#E8E0D4', nombre: 'Aromas / olores' },
  'violencia_sexual':      { color: '#B814E8', nombre: 'Violencia sexual' },
  'placer_deseo':          { color: '#FF2D8A', nombre: 'Placer / deseo' },
  'profesional_hombre':    { color: '#4A7BAF', nombre: 'Profesional hombre' },
  'profesional_mujer':     { color: '#F5DD2C', nombre: 'Profesional mujer' }
};

// Vocabulario de la columna de conceptos, derivado de los campos
// semánticos del clasificador del servidor (11 categorías producción)
const CONCEPTOS_POR_CATEGORIA = {
  'dolor_fisico': [
    'dolor', 'ardor', 'punzada', 'pinchazo', 'presion', 'calambre',
    'desgarro', 'sangre', 'herida', 'contraccion', 'umbral', 'cuerpo'
  ],
  'miedo': [
    'miedo', 'panico', 'nervios', 'temblor', 'angustia', 'terror',
    'taquicardia', 'alerta', 'anticipacion', 'llanto'
  ],
  'verguenza_exposicion': [
    'verguenza', 'pudor', 'expuesta', 'desnudez', 'vulnerable',
    'observada', 'examinada', 'intimidad', 'cosificada', 'mirada'
  ],
  'sensaciones_frias': [
    'frio', 'helado', 'metal', 'acero', 'gelido', 'rigido',
    'instrumento', 'clinico', 'escalofrio', 'distancia'
  ],
  'sensaciones_calidas': [
    'tibio', 'calido', 'suave', 'silicona', 'contacto',
    'contencion', 'abrigo', 'refugio', 'amable'
  ],
  'sonido': [
    'sonido', 'ruido', 'click', 'metalico', 'eco', 'silencio',
    'crujido', 'zumbido', 'voz', 'acustica'
  ],
  'aromas': [
    'olor', 'aroma', 'alcohol', 'desinfectante', 'latex',
    'esteril', 'quimico', 'perfume', 'ambiente'
  ],
  'violencia_sexual': [
    'consentimiento', 'limite', 'violencia', 'abuso', 'invasion',
    'trauma', 'memoria', 'cuerpo'
  ],
  'placer_deseo': [
    'placer', 'deseo', 'goce', 'sensualidad', 'autonomia',
    'exploracion', 'curiosidad', 'piel'
  ],
  'profesional_hombre': [
    'medico', 'doctor', 'ginecologo', 'autoridad', 'presencia',
    'voz masculina', 'distancia'
  ],
  'profesional_mujer': [
    'medica', 'matrona', 'ginecologa', 'doctora', 'acompanamiento',
    'voz', 'confianza', 'cuidado'
  ]
};

// Perfil tímbrico por categoría: modula el carácter del bordón
// (filtro, resonancia, metal) y el timbre de los pulsos de colisión.
// Las alturas del bordón NO dependen de esto: quedan ancladas a la
// serie armónica de 231 Hz para mantenerse consonantes con los ingresos.
const AUDIO_POR_CATEGORIA = {
  'dolor_fisico':         { filtro: 520,  pulso: 150, q: 1.1, metal: 0.15 },
  'miedo':                { filtro: 1260, pulso: 430, q: 2.7, metal: 0.42 },
  'verguenza_exposicion': { filtro: 900,  pulso: 300, q: 1.8, metal: 0.30 },
  'sensaciones_frias':    { filtro: 1850, pulso: 760, q: 4.6, metal: 0.82 },
  'sensaciones_calidas':  { filtro: 760,  pulso: 220, q: 0.9, metal: 0.10 },
  'sonido':               { filtro: 1400, pulso: 560, q: 3.0, metal: 0.55 },
  'aromas':               { filtro: 680,  pulso: 240, q: 0.8, metal: 0.07 },
  'violencia_sexual':     { filtro: 1500, pulso: 520, q: 3.4, metal: 0.58 },
  'placer_deseo':         { filtro: 820,  pulso: 260, q: 1.2, metal: 0.14 },
  'profesional_hombre':   { filtro: 980,  pulso: 310, q: 2.1, metal: 0.34 },
  'profesional_mujer':    { filtro: 860,  pulso: 260, q: 1.4, metal: 0.18 }
};

const filtrosActivos = {};
for (const cat of Object.keys(CATEGORIAS)) filtrosActivos[cat] = true;

// ============================================================
// CANVAS Y DIMENSIONES
// ============================================================
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

const fluidoCanvas = document.createElement('canvas');
const fluidoCtx = fluidoCanvas.getContext('2d');

const granoMaskCanvas = document.createElement('canvas');
const granoMaskCtx = granoMaskCanvas.getContext('2d');

const difusoCanvas = document.createElement('canvas');
const difusoCtx = difusoCanvas.getContext('2d');

const fondoCanvas = document.createElement('canvas');
const fondoCtx = fondoCanvas.getContext('2d');

let granoFondoPattern = null;
let granoColorPattern = null;
let ultimoFondoAtmosferico = -Infinity;

const MAX_DPR = 1.25;
const FONDO_ATMOSFERA_INTERVALO = 140;
const DIFUSION_MOVIL_SCALE = 0.72;
const GRANO_FONDO_ALPHA = 0.055;
const GRANO_COLOR_ALPHA = 0.13;
const GRANO_COLOR_ALPHA_MOVIL = 0.025;

function ajustarCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);

  fluidoCanvas.width = W * dpr;
  fluidoCanvas.height = H * dpr;
  fluidoCtx.setTransform(1, 0, 0, 1, 0, 0);
  fluidoCtx.scale(dpr, dpr);

  granoMaskCanvas.width = W * dpr;
  granoMaskCanvas.height = H * dpr;
  granoMaskCtx.setTransform(1, 0, 0, 1, 0, 0);
  granoMaskCtx.scale(dpr, dpr);

  difusoCanvas.width = Math.max(1, Math.floor(W * DIFUSION_MOVIL_SCALE));
  difusoCanvas.height = Math.max(1, Math.floor(H * DIFUSION_MOVIL_SCALE));
  difusoCtx.setTransform(1, 0, 0, 1, 0, 0);
  difusoCtx.imageSmoothingEnabled = true;

  fondoCanvas.width = W * dpr;
  fondoCanvas.height = H * dpr;
  fondoCtx.setTransform(1, 0, 0, 1, 0, 0);
  fondoCtx.scale(dpr, dpr);

  granoFondoPattern = null;
  granoColorPattern = null;
  ultimoFondoAtmosferico = -Infinity;
}
ajustarCanvas();
window.addEventListener('resize', ajustarCanvas);

// ============================================================
// TEXTURA DE GRANO
// ============================================================
function generarGrano() {
  const tam = 220;
  const c = document.createElement('canvas');
  c.width = tam;
  c.height = tam;
  const cx = c.getContext('2d');
  const img = cx.createImageData(tam, tam);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 108 + Math.random() * 58;
    img.data[i]     = v;
    img.data[i + 1] = v;
    img.data[i + 2] = v;
    img.data[i + 3] = 190;
  }
  cx.putImageData(img, 0, 0);
  return c;
}
const granoCanvas = generarGrano();

function dibujarHalo(c, x, y, r, colorCentro, colorBorde = 'rgba(0,0,0,0)') {
  const grd = c.createRadialGradient(x, y, 0, x, y, r);
  grd.addColorStop(0, colorCentro);
  grd.addColorStop(0.48, colorCentro.replace(/[\d.]+\)$/u, '0.055)'));
  grd.addColorStop(1, colorBorde);
  c.fillStyle = grd;
  c.fillRect(0, 0, W, H);
}

function dibujarFondoAtmosferico(c) {
  const t = tiempoGlobal * 0.001;
  const pulsoLento = (Math.sin(t * 0.33) + 1) * 0.5;
  const pulsoProfundo = (Math.sin(t * 0.19 + 1.7) + 1) * 0.5;

  const base = c.createLinearGradient(0, 0, W, H);
  base.addColorStop(0, '#0a0610');
  base.addColorStop(0.22, '#12131d');
  base.addColorStop(0.48, '#150d17');
  base.addColorStop(0.72, '#071817');
  base.addColorStop(1, '#13090c');
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = 1;
  c.fillStyle = base;
  c.fillRect(0, 0, W, H);

  c.save();
  c.globalCompositeOperation = 'screen';
  dibujarHalo(
    c,
    W * (0.28 + Math.sin(t * 0.17) * 0.055),
    H * (0.38 + Math.cos(t * 0.13) * 0.050),
    Math.max(W, H) * (0.76 + pulsoLento * 0.20),
    `rgba(32,126,118,${0.22 + pulsoLento * 0.105})`
  );
  dibujarHalo(
    c,
    W * (0.74 + Math.sin(t * 0.11 + 2.0) * 0.045),
    H * (0.28 + Math.cos(t * 0.16 + 0.7) * 0.060),
    Math.max(W, H) * (0.62 + pulsoProfundo * 0.16),
    `rgba(126,45,92,${0.19 + pulsoProfundo * 0.110})`
  );
  dibujarHalo(
    c,
    W * (0.48 + Math.sin(t * 0.09 + 3.2) * 0.035),
    H * (0.82 + Math.cos(t * 0.12 + 2.6) * 0.030),
    Math.max(W, H) * 0.54,
    `rgba(202,132,58,${0.105 + pulsoLento * 0.070})`
  );
  dibujarHalo(
    c,
    W * (0.52 + Math.sin(t * 0.07 + 4.1) * 0.025),
    H * (0.50 + Math.cos(t * 0.10 + 1.6) * 0.035),
    Math.max(W, H) * 0.38,
    `rgba(214,202,145,${0.045 + pulsoProfundo * 0.035})`
  );
  c.restore();

  c.save();
  c.globalCompositeOperation = 'multiply';
  const vignette = c.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.16,
    W / 2, H / 2, Math.max(W, H) * 0.78
  );
  vignette.addColorStop(0, 'rgba(255,255,255,0)');
  vignette.addColorStop(0.58, 'rgba(36,24,31,0.15)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.68)');
  c.fillStyle = vignette;
  c.fillRect(0, 0, W, H);
  c.restore();

  if (!granoFondoPattern) granoFondoPattern = c.createPattern(granoCanvas, 'repeat');
  c.save();
  c.globalCompositeOperation = 'soft-light';
  c.globalAlpha = GRANO_FONDO_ALPHA;
  c.fillStyle = granoFondoPattern;
  c.fillRect(0, 0, W, H);
  c.restore();
}

// ============================================================
// FACTOR DE MUNDO
// ============================================================
let totalRelatos = 64;
function getWorldFactor() {
  return Math.sqrt(Math.max(64, totalRelatos) / 64);
}
function getWorldRadius() {
  return 720 * getWorldFactor();
}

// ============================================================
// CÁMARA
// ============================================================
const cam = {
  x: 0, y: 0,
  scale: 0.5,
  tx: 0, ty: 0,
  tscale: 0.5,
  MIN_SCALE: 0.05,
  MAX_SCALE: 4,
};

function screenToWorld(sx, sy) {
  return {
    x: (sx - W / 2) / cam.scale + cam.x,
    y: (sy - H / 2) / cam.scale + cam.y,
  };
}

function ajustarCamaraInicial() {
  cam.tx = 0; cam.ty = 0;
  const vertical = H > W * 1.2;
  cam.tscale = vertical ? 0.58 : 1.15;
  cam.x = cam.tx; cam.y = cam.ty; cam.scale = cam.tscale;
}

// ============================================================
// GRADIENTES PRE-RENDERIZADOS
// ============================================================
function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}

function crearGradienteChispa(rgb) {
  const tam = 128;
  const off = document.createElement('canvas');
  off.width = tam;
  off.height = tam;
  const c = off.getContext('2d');
  const grd = c.createRadialGradient(tam/2, tam/2, 0, tam/2, tam/2, tam/2);
  grd.addColorStop(0,    `rgba(${rgb.r},${rgb.g},${rgb.b},1.000)`);
  grd.addColorStop(0.25, `rgba(${rgb.r},${rgb.g},${rgb.b},0.880)`);
  grd.addColorStop(0.45, `rgba(${rgb.r},${rgb.g},${rgb.b},0.610)`);
  grd.addColorStop(0.65, `rgba(${rgb.r},${rgb.g},${rgb.b},0.290)`);
  grd.addColorStop(0.82, `rgba(${rgb.r},${rgb.g},${rgb.b},0.075)`);
  grd.addColorStop(0.93, `rgba(${rgb.r},${rgb.g},${rgb.b},0.010)`);
  grd.addColorStop(1,    `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
  c.fillStyle = grd;
  c.fillRect(0, 0, tam, tam);
  return off;
}

function crearGradienteMancha(rgb) {
  const tam = 192;
  const off = document.createElement('canvas');
  off.width = tam;
  off.height = tam;
  const c = off.getContext('2d');
  const grd = c.createRadialGradient(tam/2, tam/2, 0, tam/2, tam/2, tam/2);
  grd.addColorStop(0,    `rgba(${rgb.r},${rgb.g},${rgb.b},0.98)`);
  grd.addColorStop(0.16, `rgba(${rgb.r},${rgb.g},${rgb.b},0.82)`);
  grd.addColorStop(0.34, `rgba(${rgb.r},${rgb.g},${rgb.b},0.48)`);
  grd.addColorStop(0.58, `rgba(${rgb.r},${rgb.g},${rgb.b},0.15)`);
  grd.addColorStop(1,    `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
  c.fillStyle = grd;
  c.fillRect(0, 0, tam, tam);
  return off;
}

const gradChispa = {};
const gradMancha = {};
for (const [cat, info] of Object.entries(CATEGORIAS)) {
  const rgb = hexToRgb(info.color);
  gradChispa[cat] = crearGradienteChispa(rgb);
  gradMancha[cat] = crearGradienteMancha(rgb);
}
