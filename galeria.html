<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espéculo(ar) imágenes</title>
<style>
  /* Roboto Light (300) y Regular (400), alojadas en el repositorio.
     Licencia SIL Open Font License 1.1: ver LICENCIA_FUENTE_ROBOTO.txt */
  @font-face { font-family: 'Roboto'; font-weight: 300; src: url('Roboto-Light.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Roboto'; font-weight: 400; src: url('Roboto-Regular.woff2') format('woff2'); font-display: swap; }

  :root {
    --papel: #faf9f6;
    --tinta: #151515;
    --gris: #8b8880;
    --gris-claro: #c9c6bf;
    --celda: 160px;
    --cols: 8;
    --margen: 40px;
    --letra: 'Roboto', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--papel); color: var(--tinta); }
  body { font-family: var(--letra); font-weight: 400; font-size: 11px; line-height: 1.45; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 1px dotted var(--tinta); outline-offset: 3px; }

  /* ---------- cabecera ---------- */
  .cabecera {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 30px var(--margen) 26px;
  }
  .cabecera .titulo { font-size: 12px; }
  #abrir-sobre { display: block; margin-top: 6px; color: var(--gris); }
  #abrir-sobre:hover { color: var(--tinta); }

  /* ---------- sobre las imágenes ---------- */
  #sobre {
    position: fixed; inset: 0; z-index: 12; display: none;
    background: var(--papel); overflow-y: auto; overscroll-behavior: contain;
  }
  #sobre.abierta { display: block; }
  .sobre-cuerpo { width: min(480px, calc(100vw - 2 * var(--margen))); margin: 30px auto 90px; }
  .sobre-cuerpo h2 { font: inherit; font-size: 12px; margin: 0 0 22px; }
  .sobre-cuerpo p { font-weight: 300; font-size: 13.5px; line-height: 1.7; color: #1d1d1d; margin: 0 0 14px; }
  .cuenta { text-align: right; }
  .cuenta .creando { color: var(--gris); }
  #actualizar { display: none; margin-top: 8px; text-decoration: underline; text-underline-offset: 3px; }
  #actualizar.visible { display: inline-block; }

  /* ---------- lámina: grilla de celdas con puntos en las esquinas ---------- */
  .lamina {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--celda));
    grid-auto-rows: var(--celda);
    width: calc(var(--cols) * var(--celda) + 2px);
    margin: 0 auto 90px;
    padding: 1px;
    background-image: radial-gradient(circle, var(--tinta) 1.15px, transparent 1.6px);
    background-size: var(--celda) var(--celda);
    background-origin: content-box;
    background-position: calc(var(--celda) / -2) calc(var(--celda) / -2);
  }
  .pieza { position: relative; min-width: 0; min-height: 0; }

  /* imagen: un marco dentro de su espacio, con margen y alineación propios */
  .imagen {
    display: flex; flex-direction: column; gap: 6px;
    padding: var(--pad, 10%);
    align-items: var(--x, flex-start);
    justify-content: var(--y, flex-start);
  }
  .marco { display: block; width: var(--w, 70%); aspect-ratio: var(--ar, 1 / 1); overflow: hidden; background: #ebe8e1; }
  .marco img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.9s; }
  .marco img.cargada { opacity: 1; }
  .marco:hover img { filter: contrast(1.04) brightness(0.97); }
  .rotulo { display: flex; gap: 8px; align-items: center; color: var(--gris); width: var(--w, 70%); }
  .imagen:hover .rotulo, .marco:focus-visible + .rotulo { color: var(--tinta); }
  .puntos { display: inline-flex; gap: 3px; }
  .punto { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .rotulo .marca-nueva { color: var(--tinta); }

  /* palabras de los relatos entre las imágenes */
  .palabra {
    display: flex; flex-direction: column; gap: 4px;
    padding: 12% 10%;
    align-items: var(--x, flex-start);
    justify-content: var(--y, center);
  }
  .palabra .linea { display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap; }
  .palabra .punto { transform: translateY(-0.18em); }
  .palabra.ligera .linea { font-weight: 300; font-size: calc(var(--celda) * var(--tam, 0.13)); line-height: 1.1; }
  .palabra.versal .linea { font-size: 11px; text-transform: uppercase; }

  /* paréntesis finos, como los del título */
  .parentesis { display: flex; align-items: stretch; justify-content: center; padding: 8% 0; }
  .parentesis svg { height: 100%; width: auto; color: var(--tinta); overflow: visible; }

  /* frases cortas, copiadas textualmente de los relatos */
  .frase {
    display: flex; flex-direction: column; gap: 9px;
    padding: 9% 6%;
    align-items: var(--x, flex-start);
    justify-content: var(--y, center);
  }
  .frase .texto {
    font-weight: 300; font-size: max(13px, calc(var(--celda) * var(--tam, 0.1))); line-height: 1.28;
    width: var(--ancho, 100%); text-align: left;
    text-decoration: underline; text-decoration-color: transparent;
    text-decoration-thickness: 1px; text-underline-offset: 0.22em;
    transition: text-decoration-color 0.3s;
  }
  .frase .texto:hover, .frase .texto:focus-visible { text-decoration-color: var(--c, var(--tinta)); }
  .frase .cita { display: flex; gap: 8px; align-items: center; color: var(--gris); width: var(--ancho, 100%); }

  #vacio { display: none; text-align: center; color: var(--gris); padding: 80px 20px; }

  /* ---------- ficha: la imagen abierta, con el relato debajo ---------- */
  #ficha {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: var(--papel); overflow-y: auto; overscroll-behavior: contain;
  }
  #ficha.abierta { display: block; }
  .ficha-barra {
    position: sticky; top: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px var(--margen) 18px; background: var(--papel);
  }
  .ficha-barra .derecha { display: flex; gap: 22px; }
  .ficha-cuerpo { width: min(640px, calc(100vw - 2 * var(--margen))); margin: 10px auto 90px; }
  .ficha-cuerpo .foto { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #ebe8e1; }
  .ficha-texto { max-width: 480px; margin-top: 22px; }
  .ficha-cats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 20px; color: var(--gris); }
  .ficha-cats .cat { display: inline-flex; gap: 7px; align-items: center; }
  #ficha-relato { font-weight: 300; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; color: #1d1d1d; margin: 0; }
  #ficha-relato.cargando { color: var(--gris-claro); }
  #ficha-relato mark { background: none; color: inherit; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: var(--c, var(--tinta)); }
  #ficha-bloqueos { display: none; margin-top: 12px; color: var(--gris); }
  #ficha-traducir { display: none; margin-top: 12px; color: var(--gris); }
  #ficha-traducir:hover { color: var(--tinta); }
  .ficha-nav { display: flex; justify-content: space-between; margin-top: 46px; color: var(--gris); }
  .ficha-nav button:hover, .ficha-barra button:hover { color: var(--tinta); }

  @media (max-width: 700px) {
    :root { --margen: 16px; }
  }
</style>
</head>
<body>
<header class="cabecera">
  <div>
    <div class="titulo">ESPÉCULO(AR)</div>
    <button id="abrir-sobre" type="button" aria-haspopup="dialog"></button>
  </div>
  <div class="cuenta">
    <div id="n-imagenes">&nbsp;</div>
    <div class="creando" id="n-creando"></div>
    <button id="actualizar" type="button"></button>
  </div>
</header>

<main class="lamina" id="lamina" aria-label="Imágenes generadas a partir de los relatos"></main>
<div id="vacio"></div>

<div id="sobre" role="dialog" aria-modal="true" aria-labelledby="sobre-titulo">
  <div class="ficha-barra">
    <span>ESPÉCULO(AR)</span>
    <button id="cerrar-sobre" type="button"></button>
  </div>
  <div class="sobre-cuerpo">
    <h2 id="sobre-titulo"></h2>
    <div id="sobre-texto"></div>
  </div>
</div>

<div id="ficha" role="dialog" aria-modal="true" aria-label="Imagen y relato">
  <div class="ficha-barra">
    <span>ESPÉCULO(AR) <span id="ficha-num"></span></span>
    <span class="derecha"><button id="cerrar" type="button"></button></span>
  </div>
  <article class="ficha-cuerpo">
    <img class="foto" id="ficha-img" alt="">
    <div class="ficha-texto">
      <p id="ficha-relato"></p>
      <div id="ficha-cats" class="ficha-cats"></div>
      <p id="ficha-bloqueos"></p>
      <button id="ficha-traducir" type="button"></button>
    </div>
    <nav class="ficha-nav">
      <button id="anterior" type="button"></button>
      <button id="siguiente" type="button"></button>
    </nav>
  </article>
</div>

<script>
// ============================================================
// Galería de Espéculo(ar)
// ============================================================
// Las imágenes se reparten sobre una grilla de celdas con puntos en las
// esquinas, con tamaños, márgenes y alineaciones distintos, celdas vacías,
// palabras tomadas de cada relato, algunas frases cortas copiadas de los
// relatos y paréntesis como los del título. La disposición sale de una
// semilla por imagen: es irregular, pero no cambia al recargar. Al abrir una
// imagen aparece el relato debajo, en letra chica, y bajo él sus categorías.
//   ?idioma=en      etiquetas en inglés
//   ?servidor=URL   otro servidor (pruebas)
// ============================================================
const RENDER_API = 'https://especuloar-servidor.onrender.com';
const parametros = new URLSearchParams(location.search);
const _host = location.hostname;
const _esRedLocal =
  ['localhost', '127.0.0.1'].includes(_host) ||
  /^192\.168\./.test(_host) || /^10\./.test(_host) ||
  /^172\.(1[6-9]|2\d|3[01])\./.test(_host);
const API_BASE = parametros.get('servidor') ||
  ((_esRedLocal && location.protocol.startsWith('http')) ? location.origin
    : (location.protocol === 'file:' ? 'http://127.0.0.1:5000' : RENDER_API));
const SONDEO_MS = 30000;

// Categorías cuyas palabras no flotan entre las imágenes (siguen visibles
// en el relato). Los relatos con alguna de ellas tampoco aportan frases
// sueltas. Ejemplo: ['violencia_sexual'].
const CATEGORIAS_SIN_PALABRAS = [];

// Mismos colores y nombres que la galaxia (display.html).
const CATEGORIAS = {
  'dolor_fisico':          { color: '#FF2424', nombre: 'Dolor físico',            nombre_en: 'Physical pain' },
  'miedo':                 { color: '#A01F35', nombre: 'Miedo',                   nombre_en: 'Fear' },
  'verguenza_exposicion':  { color: '#C4943D', nombre: 'Vergüenza / exposición',  nombre_en: 'Shame / exposure' },
  'sensaciones_frias':     { color: '#2EC4D8', nombre: 'Sensaciones frías',       nombre_en: 'Cold sensations' },
  'sensaciones_calidas':   { color: '#E8935A', nombre: 'Sensaciones cálidas',     nombre_en: 'Warm sensations' },
  'sonido':                { color: '#6BBF8A', nombre: 'Sonido / acústica',       nombre_en: 'Sound / acoustics' },
  'aromas':                { color: '#E8E0D4', nombre: 'Aromas / olores',         nombre_en: 'Aromas / smells' },
  'violencia_sexual':      { color: '#B814E8', nombre: 'Violencia sexual',        nombre_en: 'Sexual violence' },
  'placer_deseo':          { color: '#FF2D8A', nombre: 'Placer / deseo',          nombre_en: 'Pleasure / desire' },
  'profesional_hombre':    { color: '#4A7BAF', nombre: 'Profesional hombre',      nombre_en: 'Male professional' },
  'profesional_mujer':     { color: '#F5DD2C', nombre: 'Profesional mujer',       nombre_en: 'Female professional' },
  'artefactos_procedimientos': { color: '#7C8A99', nombre: 'Artefactos / procedimientos', nombre_en: 'Artifacts / procedures' },
  'emergentes':            { color: '#9A8CFF', nombre: 'Emergentes',              nombre_en: 'Emergent' }
};
// Los colores muy claros se ven poco sobre el papel: llevan un borde fino.
const COLORES_CLAROS = new Set(['#E8E0D4', '#F5DD2C']);

const IDIOMA = parametros.get('idioma') === 'en' ? 'en' : 'es';
const T = {
  es: { bloqueos: n => `(el filtro de contenido del modelo bloqueó ${n === 1 ? 'un intento anterior' : n + ' intentos anteriores'} con este relato; esta imagen salió de otra semilla)`,
        imagenes: n => `${n} ${n === 1 ? 'imagen' : 'imágenes'}`, creando: n => `${n} en creación`,
        nuevas: n => `(${n} ${n === 1 ? 'nueva' : 'nuevas'})`, vacio: '(las imágenes aparecerán aquí a medida que se generen)',
        cerrar: '(cerrar)', anterior: '(anterior)', siguiente: '(siguiente)', abrir: n => `Abrir imagen ${n}`, imagen: n => `Imagen ${n}`, nueva: 'nueva', cargando: '...' },
  en: { bloqueos: n => `(the model's content filter blocked ${n === 1 ? 'an earlier attempt' : n + ' earlier attempts'} with this testimony; this image came from another seed)`,
        imagenes: n => `${n} ${n === 1 ? 'image' : 'images'}`, creando: n => `${n} in progress`,
        nuevas: n => `(${n} new)`, vacio: '(images will appear here as they are generated)',
        cerrar: '(close)', anterior: '(previous)', siguiente: '(next)', abrir: n => `Open image ${n}`, imagen: n => `Image ${n}`, nueva: 'new', cargando: '...' }
}[IDIOMA];
document.documentElement.lang = IDIOMA;

// Texto de "sobre las imágenes". La última línea depende de si el servidor
// logró desactivar el filtro de contenido del modelo (/imagenes: filtro_modelo).
const SOBRE = {
  es: {
    boton: '(sobre las imágenes)', titulo: 'SOBRE LAS IMÁGENES',
    inicio: {
      original: 'Cada imagen se generó automáticamente a partir de un relato. El texto entra tal como fue escrito, en su idioma, al modelo Stable Diffusion 1.5, sin edición ni instrucciones adicionales, y nadie elige ni retoca el resultado.',
      ingles: 'Cada imagen se generó automáticamente a partir de un relato. El texto se traduce al inglés de forma literal y entra así al modelo Stable Diffusion 1.5, sin edición ni instrucciones adicionales, y nadie elige ni retoca el resultado.',
    },
    parrafos: [
      'Ese modelo aprendió a vincular palabras e imágenes a partir de pares de imagen y texto recopilados de internet: fotografías, ilustraciones, publicidad, noticias y foros, junto a las descripciones que personas escribieron para ellas. Fue entrenado sobre subconjuntos de LAION-2B(en), la porción en inglés de LAION-5B, un conjunto de unos 5.850 millones de pares de imagen y texto extraídos de Common Crawl y seleccionados en parte por un modelo que puntúa la calidad estética. Lo que aparece en cada imagen viene de esas asociaciones humanas acumuladas en internet.',
    ],
    lectura: {
      original: 'El modelo lee los primeros 77 tokens de cada relato, unas 40 a 50 palabras en español, y fue entrenado sobre todo con descripciones en inglés.',
      ingles: 'El modelo fue entrenado sobre todo con descripciones en inglés; por eso recibe la traducción. Lee sus primeros 77 tokens, aproximadamente las primeras 50 palabras.',
    },
    filtro: {
      desactivado: 'Ninguna imagen se elimina por su contenido, con una excepción: toda imagen que muestre a una persona menor de edad desnuda o en un contexto sexual se elimina sin guardarse y se genera otra. Las imágenes con desnudez o contenido sexual, o con muchas letras simuladas, pasan por una revisión humana antes de publicarse.',
      activo: 'El modelo aplica su propio filtro de contenido, que bloquea imágenes con desnudos o contenido sexual; cuando eso ocurre, se genera otra imagen. Fuera de eso, ninguna imagen se elimina por su contenido, salvo las que muestren a una persona menor de edad desnuda o en un contexto sexual. Las imágenes con muchas letras simuladas pasan por una revisión humana antes de publicarse.',
    },
  },
  en: {
    boton: '(about the images)', titulo: 'ABOUT THE IMAGES',
    inicio: {
      original: 'Each image was generated automatically from a testimony. The text goes into the Stable Diffusion 1.5 model exactly as it was written, in its own language, with no editing or added instructions, and no one selects or retouches the result.',
      ingles: 'Each image was generated automatically from a testimony. The text is translated literally into English and goes into the Stable Diffusion 1.5 model that way, with no editing or added instructions, and no one selects or retouches the result.',
    },
    parrafos: [
      'The model learned to link words and images from image and text pairs collected from the internet: photographs, illustrations, advertising, news and forums, together with the descriptions people wrote for them. It was trained on subsets of LAION-2B(en), the English portion of LAION-5B, a set of about 5.85 billion image and text pairs extracted from Common Crawl and partly selected by a model that scores aesthetic quality. What appears in each image comes from those human associations accumulated on the internet.',
    ],
    lectura: {
      original: 'The model reads the first 77 tokens of each testimony, roughly 40 to 50 words in Spanish, and was trained mostly on English descriptions.',
      ingles: 'The model was trained mostly on English descriptions, which is why it receives the translation. It reads its first 77 tokens, roughly the first 50 words.',
    },
    filtro: {
      desactivado: 'No image is removed for its content, with one exception: any image showing a minor naked or in a sexual context is deleted without being stored and another one is generated. Images with nudity or sexual content, or with many simulated letters, go through human review before being published.',
      activo: 'The model applies its own content filter, which blocks images with nudity or sexual content; when that happens, another image is generated. Beyond that, no image is removed for its content, except those showing a minor naked or in a sexual context. Images with many simulated letters go through human review before being published.',
    },
  },
}[IDIOMA];
let filtroModelo = 'activo';
let idiomaModelo = 'original';

function nombreCategoria(cat, idioma) {
  const info = CATEGORIAS[cat];
  return info ? (idioma === 'en' ? info.nombre_en : info.nombre) : cat;
}
function crearPunto(cat, tam) {
  const color = (CATEGORIAS[cat] || { color: '#888' }).color;
  const p = document.createElement('span');
  p.className = 'punto';
  p.style.background = color;
  if (tam) { p.style.width = p.style.height = tam + 'px'; }
  if (COLORES_CLAROS.has(color)) p.style.boxShadow = 'inset 0 0 0 0.5px #8b8880';
  return p;
}
function numero(n) { return '(' + String(n).padStart(3, '0') + ')'; }

// ---------- azar con semilla (la disposición no cambia al recargar) ----------
function azar(semilla) {
  let a = (semilla * 2654435761) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const elegir = (r, lista) => lista[Math.floor(r() * lista.length)];

// ---------- medidas de la lámina ----------
const raiz = document.documentElement;
let COLS = 8;
function medir() {
  const ancho = window.innerWidth;
  const cols = ancho >= 1500 ? 9 : ancho >= 1150 ? 8 : ancho >= 860 ? 6 : ancho >= 560 ? 4 : 3;
  const margen = ancho < 700 ? 16 : 40;
  const celda = Math.floor((Math.min(ancho, 1700) - 2 * margen - 2) / cols);
  raiz.style.setProperty('--cols', cols);
  raiz.style.setProperty('--celda', celda + 'px');
  const cambio = cols !== COLS;
  COLS = cols;
  return { cambio, celda };
}

// Formas posibles de una imagen: celdas que ocupa, ancho del marco y proporción.
const FORMAS = [
  { nombre: 'chica',      peso: 38, c: 1, f: 1, w: [62, 76], ar: '1 / 1' },
  { nombre: 'mediana',    peso: 28, c: 2, f: 2, w: [64, 82], ar: '1 / 1' },
  { nombre: 'vertical',   peso: 14, c: 1, f: 2, w: [80, 92], ar: '3 / 4' },
  { nombre: 'horizontal', peso: 12, c: 2, f: 1, w: [50, 58], ar: '3 / 2' },
  { nombre: 'grande',     peso: 8,  c: 3, f: 3, w: [66, 80], ar: '1 / 1', minCols: 6 },
];
function elegirForma(r) {
  const posibles = FORMAS.filter(f => !f.minCols || COLS >= f.minCols);
  let total = posibles.reduce((s, f) => s + f.peso, 0), x = r() * total;
  for (const f of posibles) { if ((x -= f.peso) < 0) return f; }
  return posibles[0];
}
const ALINEAR = ['flex-start', 'center', 'flex-end'];

// ---------- piezas ----------
function piezaImagen(img, n, r) {
  const forma = elegirForma(r);
  const fig = document.createElement('figure');
  fig.className = 'pieza imagen' + (img.nueva ? ' nueva' : '');
  fig.style.gridColumn = `span ${forma.c}`;
  fig.style.gridRow = `span ${forma.f}`;
  fig.style.margin = '0';
  const w = forma.w[0] + r() * (forma.w[1] - forma.w[0]);
  fig.style.setProperty('--w', w.toFixed(1) + '%');
  fig.style.setProperty('--ar', forma.ar);
  fig.style.setProperty('--pad', (7 + r() * 7).toFixed(1) + '%');
  fig.style.setProperty('--x', elegir(r, ALINEAR));
  fig.style.setProperty('--y', elegir(r, ALINEAR));

  const marco = document.createElement('button');
  marco.className = 'marco';
  marco.type = 'button';
  marco.setAttribute('aria-label', T.abrir(numero(n)));
  const foto = document.createElement('img');
  foto.loading = 'lazy';
  foto.decoding = 'async';
  foto.alt = '';
  foto.onload = () => foto.classList.add('cargada');
  const px = parseFloat(getComputedStyle(raiz).getPropertyValue('--celda')) * forma.c * (window.devicePixelRatio || 1);
  const ancho = Math.max(128, Math.min(768, Math.round(px / 128) * 128));
  foto.src = `${API_BASE}${img.url}&ancho=${ancho}`;
  marco.appendChild(foto);
  marco.addEventListener('click', () => abrir(img.id, marco));

  const rotulo = document.createElement('figcaption');
  rotulo.className = 'rotulo';
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = numero(n);
  const puntos = document.createElement('span');
  puntos.className = 'puntos';
  for (const cat of img.categorias || []) puntos.appendChild(crearPunto(cat));
  rotulo.append(num, puntos);
  if (img.nueva) {
    const marca = document.createElement('span');
    marca.className = 'marca-nueva';
    marca.textContent = T.nueva;
    rotulo.appendChild(marca);
  }
  fig.append(marco, rotulo);
  return fig;
}

function piezaPalabras(palabras, r) {
  const div = document.createElement('div');
  const ligera = r() < 0.72;
  div.className = 'pieza palabra ' + (ligera ? 'ligera' : 'versal');
  div.setAttribute('aria-hidden', 'true');
  const cuantas = palabras.length > 1 && r() < 0.3 ? 2 : 1;
  const largo = Math.max(...palabras.slice(0, cuantas).map(p => p.texto.length));
  // las palabras largas ocupan dos celdas para no desbordarse
  const columnas = ligera && (largo > 9 || cuantas === 2) && COLS >= 4 ? 2 : 1;
  div.style.gridColumn = `span ${columnas}`;
  div.style.setProperty('--tam', (0.11 + r() * 0.05).toFixed(3));
  div.style.setProperty('--x', elegir(r, ALINEAR));
  div.style.setProperty('--y', elegir(r, ALINEAR));
  const inicio = Math.floor(r() * palabras.length);
  for (let i = 0; i < cuantas; i++) {
    const p = palabras[(inicio + i) % palabras.length];
    const linea = document.createElement('span');
    linea.className = 'linea';
    linea.append(crearPunto(p.categoria, ligera ? 7 : 6), document.createTextNode(p.texto));
    div.appendChild(linea);
  }
  return div;
}

function piezaParentesis(abre) {
  const div = document.createElement('div');
  div.className = 'pieza parentesis';
  div.style.gridRow = 'span 2';
  div.setAttribute('aria-hidden', 'true');
  const d = abre ? 'M30 2 C 6 52, 6 148, 30 198' : 'M10 2 C 34 52, 34 148, 10 198';
  div.innerHTML = `<svg viewBox="0 0 40 200" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
  return div;
}

function piezaVacia() {
  const div = document.createElement('div');
  div.className = 'pieza';
  return div;
}

// ---------- frases sueltas ----------
// El servidor extrae de cada relato hasta dos frases cortas, copiadas
// textualmente, con un peso del 1 al 5. Aquí se eligen unas pocas para la
// lámina (una cada seis imágenes, aprox.). Cuentan el peso de la frase y
// cuán presentes están sus categorías en la colección; a medida que se eligen,
// pasan adelante las categorías que aún no tienen frase, en proporción a su
// presencia, y los relatos recientes tienen una ventaja leve. La selección se
// recalcula con cada relato nuevo.
function elegirFrases(lista) {
  const n = lista.length;
  const cuantas = Math.min(40, Math.max(2, Math.round(n / 6)));
  const presencia = {};
  for (const img of lista) for (const c of img.categorias || []) presencia[c] = (presencia[c] || 0) + 1 / n;
  const candidatas = [];
  lista.forEach((img, i) => {
    const cats = img.categorias || [];
    if (cats.some(c => CATEGORIAS_SIN_PALABRAS.includes(c))) return;
    const frases = (img.frases || []).filter(f => f && typeof f.texto === 'string' && f.texto.trim());
    if (!frases.length) return;
    const frase = frases.reduce((a, b) => ((b.peso || 0) > (a.peso || 0) ? b : a));
    candidatas.push({ img, frase, cats, reciente: 1 - i / n });   // lista: más nuevas primero
  });
  const elegidas = new Map(), usadas = {};
  while (elegidas.size < cuantas && candidatas.length) {
    const k = elegidas.size;
    let mejor = 0, puntaje = -Infinity;
    candidatas.forEach((c, i) => {
      const falta = c.cats.length
        ? c.cats.reduce((s, cat) => s + (presencia[cat] || 0) - (k ? (usadas[cat] || 0) / k : 0), 0) / c.cats.length
        : 0;
      const p = (c.frase.peso || 3) / 5 + 2 * falta + 0.3 * c.reciente;
      if (p > puntaje) { puntaje = p; mejor = i; }
    });
    const [c] = candidatas.splice(mejor, 1);
    elegidas.set(c.img.id, c.frase);
    for (const cat of c.cats) usadas[cat] = (usadas[cat] || 0) + 1;
    // la misma frase escrita en dos relatos aparece una sola vez
    const igual = comparable(c.frase.texto);
    for (let i = candidatas.length - 1; i >= 0; i--) {
      if (comparable(candidatas[i].frase.texto) === igual) candidatas.splice(i, 1);
    }
  }
  return elegidas;
}
function comparable(texto) {
  return texto.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
}

// Quita la puntuación suelta del final; conserva ?, ! y los puntos suspensivos.
function limpiarFrase(texto) {
  let t = texto.trim().replace(/[\s,;:]+$/, '');
  if (/[^.]\.$/.test(t)) t = t.slice(0, -1);
  return t;
}

function piezaFrase(img, frase, n) {
  const r = azar(img.id * 53 + 11);
  const div = document.createElement('div');
  div.className = 'pieza frase';
  div.style.gridColumn = `span ${COLS >= 6 ? 3 : COLS >= 4 ? 2 : COLS}`;
  div.style.setProperty('--tam', (0.095 + r() * 0.03).toFixed(3));
  div.style.setProperty('--ancho', (80 + r() * 20).toFixed(1) + '%');
  div.style.setProperty('--x', elegir(r, ALINEAR));
  div.style.setProperty('--y', elegir(r, ALINEAR));
  const cats = img.categorias || [];
  if (cats.length) div.style.setProperty('--c', (CATEGORIAS[cats[0]] || { color: '#151515' }).color);

  // la frase abre la imagen y el relato del que salió
  const texto = document.createElement('button');
  texto.type = 'button';
  texto.className = 'texto';
  texto.textContent = limpiarFrase(frase.texto);
  texto.addEventListener('click', () => abrir(img.id, texto));
  const cita = document.createElement('span');
  cita.className = 'cita';
  const num = document.createElement('span');
  num.textContent = numero(n);
  const puntos = document.createElement('span');
  puntos.className = 'puntos';
  for (const cat of cats) puntos.appendChild(crearPunto(cat));
  cita.append(num, puntos);
  div.append(texto, cita);
  return div;
}

// Una frase larga en una lámina angosta puede no caber en una fila: ocupa dos.
function ajustarFrases() {
  for (const div of lamina.querySelectorAll('.pieza.frase')) {
    div.style.gridRow = '';
    if (div.scrollHeight > div.clientHeight + 1) div.style.gridRow = 'span 2';
  }
}

// ---------- composición ----------
const lamina = document.getElementById('lamina');
let imagenes = [];        // más nuevas primero
let numeros = new Map();  // id -> número de archivo (la más antigua es 001)
let frasesElegidas = new Map();  // id de imagen -> frase suelta
let firmaActual = '';
let firmaImagenesActual = '';
let pendientesNuevas = 0;

function componer() {
  lamina.innerHTML = '';
  document.getElementById('vacio').style.display = imagenes.length ? 'none' : 'block';
  let abierto = 0;           // piezas que faltan para cerrar un paréntesis
  let enEspera = [];         // frases que aparecen unas imágenes después de la suya
  for (const img of imagenes) {
    const r = azar(img.id * 31 + 7);
    const vacias = r() < 0.34 ? (r() < 0.3 ? 2 : 1) : 0;
    for (let i = 0; i < vacias; i++) lamina.appendChild(piezaVacia());
    if (!abierto && r() < 0.09) {
      lamina.appendChild(piezaParentesis(true));
      abierto = 2 + Math.floor(r() * 3);
    }
    lamina.appendChild(piezaImagen(img, numeros.get(img.id), r));
    const frase = frasesElegidas.get(img.id);
    if (frase) {
      enEspera.push({ img, frase, faltan: Math.floor(azar(img.id * 7 + 3)() * 3) });
    } else {
      const palabras = (img.palabras || []).filter(p => !CATEGORIAS_SIN_PALABRAS.includes(p.categoria));
      if (palabras.length && r() < 0.5) lamina.appendChild(piezaPalabras(palabras, r));
    }
    for (const e of enEspera) {
      if (e.faltan-- === 0) lamina.appendChild(piezaFrase(e.img, e.frase, numeros.get(e.img.id)));
    }
    enEspera = enEspera.filter(e => e.faltan >= 0);
    if (abierto && --abierto === 0) lamina.appendChild(piezaParentesis(false));
  }
  for (const e of enEspera) lamina.appendChild(piezaFrase(e.img, e.frase, numeros.get(e.img.id)));
  if (abierto) lamina.appendChild(piezaParentesis(false));
  ajustarFrases();
  if (document.fonts) document.fonts.ready.then(ajustarFrases);
}

// ---------- datos ----------
async function cargar(forzar) {
  let datos;
  try {
    const res = await fetch(`${API_BASE}/imagenes?palabras=1`, { cache: 'no-store' });
    if (!res.ok) return;
    datos = await res.json();
  } catch (e) { return; }
  if (datos.filtro_modelo === 'desactivado' || datos.filtro_modelo === 'activo') filtroModelo = datos.filtro_modelo;
  if (typeof datos.traducir_al_ingles === 'boolean') idiomaModelo = datos.traducir_al_ingles ? 'ingles' : 'original';
  const lista = (datos.imagenes || []).slice().sort((a, b) => b.respuesta_id - a.respuesta_id);
  const seleccion = elegirFrases(lista);
  const firmaImagenes = lista.map(i => i.id + ':' + i.url).join('|');
  const firma = firmaImagenes + '#' + [...seleccion].map(([id, f]) => id + ':' + f.texto).join('|');
  const creando = (datos.pendientes || 0) + (datos.generando || 0);
  document.getElementById('n-imagenes').textContent = T.imagenes(lista.length);
  document.getElementById('n-creando').textContent = creando ? T.creando(creando) : '';
  if (firma === firmaActual && !forzar) return;

  const conocidas = new Set(imagenes.map(i => i.id));
  const fichaAbierta = document.getElementById('ficha').classList.contains('abierta');
  // Si la persona está mirando más abajo o tiene una imagen abierta, no se
  // reordena la lámina bajo sus ojos: se ofrece actualizar. Si solo cambiaron
  // las frases elegidas, se esperan sin aviso hasta que vuelva arriba.
  if (firmaActual && !forzar && (fichaAbierta || window.scrollY > 300)) {
    if (firmaImagenes === firmaImagenesActual) return;
    pendientesNuevas = lista.filter(i => !conocidas.has(i.id)).length;
    const boton = document.getElementById('actualizar');
    boton.textContent = pendientesNuevas ? T.nuevas(pendientesNuevas) : '(actualizar)';
    boton.classList.add('visible');
    return;
  }
  const primeraVez = !firmaActual;
  for (const img of lista) img.nueva = !primeraVez && !conocidas.has(img.id);
  imagenes = lista;
  numeros = new Map([...lista].sort((a, b) => a.respuesta_id - b.respuesta_id).map((img, i) => [img.id, i + 1]));
  frasesElegidas = seleccion;
  firmaActual = firma;
  firmaImagenesActual = firmaImagenes;
  document.getElementById('actualizar').classList.remove('visible');
  componer();
  if (primeraVez) abrirDesdeDireccion();
}

document.getElementById('actualizar').addEventListener('click', () => {
  window.scrollTo({ top: 0 });
  firmaActual = firmaActual || 'x';
  cargar(true);
});

// ---------- ficha ----------
const ficha = document.getElementById('ficha');
const fichaImg = document.getElementById('ficha-img');
const fichaRelato = document.getElementById('ficha-relato');
const fichaCats = document.getElementById('ficha-cats');
const botonTraducir = document.getElementById('ficha-traducir');
document.getElementById('cerrar').textContent = T.cerrar;
document.getElementById('anterior').textContent = T.anterior;
document.getElementById('siguiente').textContent = T.siguiente;
document.getElementById('vacio').textContent = T.vacio;

const TEXTOS_TRADUCCION = {
  en: { ver: '(see in English)', original: '(ver original)', cargando: '(translating)', error: '(translation unavailable)' },
  es: { ver: '(ver en español)', original: '(see original)', cargando: '(traduciendo)', error: '(traducción no disponible)' }
};
let actual = null;        // { img, relato, idioma, destino, traducciones, mostrandoTraduccion }
let origenFoco = null;
let traduciendo = false;

function pintarCategorias(idioma) {
  fichaCats.innerHTML = '';
  for (const cat of actual.categorias) {
    const linea = document.createElement('span');
    linea.className = 'cat';
    linea.append(crearPunto(cat, 6), document.createTextNode(nombreCategoria(cat, idioma)));
    fichaCats.appendChild(linea);
  }
}

// Subraya en el relato, con el color de su categoría, las palabras que lo
// clasificaron (las mismas que flotan en la lámina).
function pintarRelato(texto, palabras) {
  fichaRelato.textContent = '';
  if (!palabras || !palabras.length) { fichaRelato.textContent = texto; return; }
  const bajo = texto.toLowerCase();
  const marcas = [];
  for (const p of palabras) {
    let desde = 0, i;
    while ((i = bajo.indexOf(p.texto, desde)) !== -1) {
      const antes = i === 0 ? '' : bajo[i - 1], despues = bajo[i + p.texto.length] || '';
      if (!/[\p{L}\p{N}]/u.test(antes) && !/[\p{L}\p{N}]/u.test(despues)) marcas.push([i, i + p.texto.length, p.categoria]);
      desde = i + p.texto.length;
    }
  }
  marcas.sort((a, b) => a[0] - b[0]);
  let pos = 0;
  for (const [ini, fin, cat] of marcas) {
    if (ini < pos) continue;
    fichaRelato.appendChild(document.createTextNode(texto.slice(pos, ini)));
    const m = document.createElement('mark');
    m.style.setProperty('--c', (CATEGORIAS[cat] || { color: '#151515' }).color);
    m.textContent = texto.slice(ini, fin);
    fichaRelato.appendChild(m);
    pos = fin;
  }
  fichaRelato.appendChild(document.createTextNode(texto.slice(pos)));
}

async function abrir(id, desde) {
  const img = imagenes.find(x => x.id === id);
  if (!img) return;
  origenFoco = desde || origenFoco;
  actual = { img, categorias: img.categorias || [], relato: null };
  const n = numeros.get(id);
  document.getElementById('ficha-num').textContent = numero(n);
  fichaImg.src = `${API_BASE}${img.url}`;
  fichaImg.alt = T.imagen(numero(n));
  fichaRelato.textContent = T.cargando;
  fichaRelato.classList.add('cargando');
  botonTraducir.style.display = 'none';
  pintarCategorias(IDIOMA);
  const bloqueos = document.getElementById('ficha-bloqueos');
  bloqueos.textContent = img.bloqueos_filtro > 0 ? T.bloqueos(img.bloqueos_filtro) : '';
  bloqueos.style.display = img.bloqueos_filtro > 0 ? 'block' : 'none';
  if (!ficha.classList.contains('abierta')) {
    ficha.classList.add('abierta');
    document.body.style.overflow = 'hidden';
  }
  ficha.scrollTop = 0;
  history.replaceState(null, '', '#r' + img.respuesta_id);
  const pedido = actual;
  try {
    const res = await fetch(`${API_BASE}/relato/${img.respuesta_id}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (actual !== pedido) return;
    const idioma = data.idioma === 'en' ? 'en' : 'es';
    Object.assign(actual, {
      relato: data.relato || '', idioma, destino: idioma === 'en' ? 'es' : 'en',
      traducciones: data.traducciones || {}, mostrandoTraduccion: false,
    });
    fichaRelato.classList.remove('cargando');
    pintarRelato(actual.relato, img.palabras);
    pintarCategorias(idioma);
    botonTraducir.textContent = TEXTOS_TRADUCCION[actual.destino].ver;
    botonTraducir.style.display = actual.relato ? 'inline-block' : 'none';
  } catch (e) {
    if (actual === pedido) fichaRelato.textContent = '';
  }
}

async function alternarTraduccion() {
  if (!actual || actual.relato === null || traduciendo) return;
  const a = actual, t = TEXTOS_TRADUCCION[a.destino];
  if (a.mostrandoTraduccion) {
    a.mostrandoTraduccion = false;
    pintarRelato(a.relato, a.img.palabras);
    pintarCategorias(a.idioma);
    botonTraducir.textContent = t.ver;
    return;
  }
  let texto = a.traducciones[a.destino];
  if (!texto) {
    traduciendo = true;
    botonTraducir.textContent = t.cargando;
    try {
      const res = await fetch(`${API_BASE}/traducir/${a.img.respuesta_id}?a=${a.destino}`, { method: 'POST' });
      if (res.ok) texto = (await res.json()).texto || null;
    } catch (e) { /* se informa abajo */ }
    traduciendo = false;
    if (actual !== a) return;
    if (!texto) {
      botonTraducir.textContent = t.error;
      setTimeout(() => { if (actual === a && !a.mostrandoTraduccion) botonTraducir.textContent = t.ver; }, 2500);
      return;
    }
    a.traducciones[a.destino] = texto;
  }
  a.mostrandoTraduccion = true;
  fichaRelato.textContent = texto;
  pintarCategorias(a.destino);
  botonTraducir.textContent = t.original;
}

function cerrar() {
  ficha.classList.remove('abierta');
  document.body.style.overflow = '';
  actual = null;
  fichaImg.removeAttribute('src');
  history.replaceState(null, '', location.pathname + location.search);
  if (origenFoco) origenFoco.focus({ preventScroll: true });
}

function mover(paso) {
  if (!actual || !imagenes.length) return;
  const i = imagenes.findIndex(x => x.id === actual.img.id);
  abrir(imagenes[(i + paso + imagenes.length) % imagenes.length].id);
}

function abrirDesdeDireccion() {
  const m = location.hash.match(/^#r(\d+)$/);
  if (!m) return;
  const img = imagenes.find(x => x.respuesta_id === Number(m[1]));
  if (img) abrir(img.id);
}

botonTraducir.addEventListener('click', alternarTraduccion);
document.getElementById('cerrar').addEventListener('click', cerrar);
document.getElementById('anterior').addEventListener('click', () => mover(-1));
document.getElementById('siguiente').addEventListener('click', () => mover(1));
// ---------- sobre las imágenes ----------
const sobre = document.getElementById('sobre');
const abrirSobre = document.getElementById('abrir-sobre');
abrirSobre.textContent = SOBRE.boton;
document.getElementById('cerrar-sobre').textContent = T.cerrar;
document.getElementById('sobre-titulo').textContent = SOBRE.titulo;
function pintarSobre() {
  const caja = document.getElementById('sobre-texto');
  caja.innerHTML = '';
  for (const texto of [SOBRE.inicio[idiomaModelo], ...SOBRE.parrafos, SOBRE.lectura[idiomaModelo], SOBRE.filtro[filtroModelo]]) {
    const p = document.createElement('p');
    p.textContent = texto;
    caja.appendChild(p);
  }
}
function cerrarSobre() {
  sobre.classList.remove('abierta');
  document.body.style.overflow = '';
  abrirSobre.focus();
}
abrirSobre.addEventListener('click', () => {
  pintarSobre();
  sobre.classList.add('abierta');
  document.body.style.overflow = 'hidden';
  document.getElementById('cerrar-sobre').focus();
});
document.getElementById('cerrar-sobre').addEventListener('click', cerrarSobre);
document.addEventListener('keydown', (e) => {
  if (sobre.classList.contains('abierta') && e.key === 'Escape') cerrarSobre();
});

document.addEventListener('keydown', (e) => {
  if (!ficha.classList.contains('abierta')) return;
  if (e.key === 'Escape') cerrar();
  else if (e.key === 'ArrowLeft') mover(-1);
  else if (e.key === 'ArrowRight') mover(1);
});

let esperaMedida = null;
window.addEventListener('resize', () => {
  clearTimeout(esperaMedida);
  esperaMedida = setTimeout(() => {
    const { cambio } = medir();
    if (!imagenes.length) return;
    if (cambio) componer(); else ajustarFrases();
  }, 150);
});

medir();
cargar();
setInterval(cargar, SONDEO_MS);
</script>
