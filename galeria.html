<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espéculo(ar) imágenes</title>
<style>
  /* Droid Sans Mono (sistema) y Droid Serif (relatos), alojadas en el
     repositorio. Licencia Apache 2.0: ver LICENCIA_FUENTES_DROID.txt */
  @font-face { font-family: 'Droid Sans Mono'; src: url('DroidSansMono.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Droid Serif'; src: url('DroidSerif.woff2') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #09050a; color: #ccc; font-family: 'Droid Sans Mono', ui-monospace, monospace; }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 1.8rem 1.8rem 1.4rem; background: rgba(9,5,10,0.94);
  }
  .titulo { font-size: 11px; letter-spacing: 0.2em; color: #555; }
  .contador { text-align: right; }
  .n-respuestas { font-size: 38px; font-weight: 300; color: #888; line-height: 1; transition: color 1.2s; }
  .n-respuestas.sube { color: #ddd; transition: color 0.15s; }
  .n-label { font-size: 9px; color: #444; letter-spacing: 0.2em; margin-top: 3px; }
  .en-creacion { font-size: 9px; color: #666; letter-spacing: 0.2em; margin-top: 10px; opacity: 0; transition: opacity 1s; }
  .en-creacion.visible { opacity: 1; }
  .pulso {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #9A8CFF;
    margin-right: 7px; vertical-align: 1px; animation: latido 1.8s ease-in-out infinite;
  }
  @keyframes latido { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  #grilla {
    display: grid; gap: 4px; padding: 0 1.8rem 3rem;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  }
  .celda {
    position: relative; aspect-ratio: 1 / 1; overflow: hidden; cursor: pointer;
    background: #120d14; border: 0; padding: 0; display: block; width: 100%;
  }
  .celda img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.8s, transform 0.6s;
  }
  .celda img.cargada { opacity: 1; }
  .celda:hover img, .celda:focus-visible img { transform: scale(1.035); }
  .celda:focus-visible { outline: 1px solid #9A8CFF; outline-offset: 2px; }
  .celda .puntos { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 4px; }
  .punto { width: 7px; height: 7px; border-radius: 50%; }
  .celda.nueva { animation: llegada 2.4s ease-out; }
  @keyframes llegada { from { box-shadow: 0 0 0 2px #9A8CFF; } to { box-shadow: 0 0 0 0 rgba(154,140,255,0); } }
  #vacio { padding: 4rem 1.8rem; font-size: 11px; letter-spacing: 0.12em; color: #444; display: none; }

  #modal {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    background: rgba(3,3,3,0.94); padding: 2rem;
  }
  #modal.activo { display: flex; }
  .modal-contenido {
    position: relative; width: 100%; max-width: 1120px; max-height: 88vh;
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    background: #0a0a0a; border: 0.5px solid #1e1e1e;
  }
  .modal-imagen { background: #000; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .modal-imagen img { display: block; width: 100%; max-height: 88vh; object-fit: contain; }
  .modal-texto {
    padding: 2.6rem 2.4rem 2rem; overflow-y: auto; max-height: 88vh;
    font-size: 13.5px; line-height: 1.75; display: flex; flex-direction: column;
  }
  .modal-categorias { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.4rem; }
  .modal-cat-chip { font-size: 9.5px; padding: 3px 9px; border-radius: 10px; color: #fff; letter-spacing: 0.04em; }
  .modal-relato { white-space: pre-wrap; color: #d8d8d8; flex: 1; font-family: 'Droid Serif', Georgia, serif; font-size: 1.06em; }
  .modal-relato.cargando { color: #444; }
  .boton-texto {
    background: none; border: none; color: rgba(255,255,255,0.28); font-size: 9px;
    letter-spacing: 0.14em; cursor: pointer; font-family: 'Droid Sans Mono', ui-monospace, monospace;
    padding: 0; transition: color 0.2s;
  }
  .boton-texto:hover, .boton-texto:focus-visible { color: rgba(255,255,255,0.7); }
  .modal-traducir { display: none; margin-top: 1.4rem; align-self: flex-start; }
  .modal-pie { display: flex; justify-content: space-between; margin-top: 2rem; padding-top: 1rem; border-top: 0.5px solid #1a1a1a; }
  .modal-cerrar { position: absolute; top: 1rem; right: 1.4rem; font-size: 11px; color: #555; letter-spacing: 0.1em; }

  @media (max-width: 760px) {
    header { padding: 1.1rem 1.1rem 1rem; }
    .n-respuestas { font-size: 28px; }
    #grilla { padding: 0 1.1rem 2rem; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    #modal { padding: 0; align-items: stretch; }
    .modal-contenido { grid-template-columns: 1fr; max-height: none; height: 100%; overflow-y: auto; }
    .modal-imagen img { max-height: 60vh; }
    .modal-texto { max-height: none; overflow: visible; padding: 1.6rem 1.4rem; font-size: 12.5px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="titulo">ESPÉCULO(AR)</div>
  </div>
  <div class="contador">
    <div class="n-respuestas" id="n-imagenes">-</div>
    <div class="n-label" id="etiqueta-imagenes">IMÁGENES</div>
    <div class="en-creacion" id="en-creacion"><span class="pulso"></span><span id="n-creacion">0</span> <span id="etiqueta-creacion">EN CREACIÓN</span></div>
  </div>
</header>

<main id="grilla" aria-label="Imágenes generadas a partir de los relatos"></main>
<div id="vacio">las imágenes aparecerán aquí a medida que se generen</div>

<div id="modal" role="dialog" aria-modal="true" aria-label="Imagen y relato">
  <div class="modal-contenido">
    <div class="modal-imagen"><img id="modal-img" alt=""></div>
    <div class="modal-texto">
      <div class="modal-categorias" id="modal-cats"></div>
      <div class="modal-relato" id="modal-relato"></div>
      <button class="boton-texto modal-traducir" id="modal-traducir" type="button">see in English</button>
      <div class="modal-pie">
        <button class="boton-texto" id="anterior" type="button">anterior</button>
        <button class="boton-texto" id="siguiente" type="button">siguiente</button>
      </div>
    </div>
    <button class="boton-texto modal-cerrar" id="cerrar" type="button">cerrar</button>
  </div>
</div>

<script>
// ============================================================
// Galería de Espéculo(ar): todas las imágenes generadas y, al abrir cada
// una, el relato que la produjo. Se actualiza sola cuando llegan nuevas.
//   ?idioma=en      etiquetas de la página en inglés
//   ?servidor=URL   otro servidor (pruebas)
// ============================================================
const RENDER_API = 'https://especuloar-servidor.onrender.com';
const parametros = new URLSearchParams(location.search);
const _host = location.hostname;
const _esRedLocal =
  ['localhost', '127.0.0.1'].includes(_host) ||
  /^192\.168\./.test(_host) || /^10\./.test(_host) ||
  /^172\.(1[6-9]|2\d|3[01])\./.test(_host);
const API_BASE = parametros.get('servidor') ||
  ((_esRedLocal && location.protocol.startsWith('http')) ? location.origin
    : (location.protocol === 'file:' ? 'http://127.0.0.1:5000' : RENDER_API));
const SONDEO_MS = 30000;

// Mismos colores y nombres que la galaxia (display.html).
const CATEGORIAS = {
  'dolor_fisico':          { color: '#FF2424', nombre: 'Dolor físico',            nombre_en: 'Physical pain' },
  'miedo':                 { color: '#A01F35', nombre: 'Miedo',                   nombre_en: 'Fear' },
  'verguenza_exposicion':  { color: '#C4943D', nombre: 'Vergüenza / exposición',  nombre_en: 'Shame / exposure' },
  'sensaciones_frias':     { color: '#2EC4D8', nombre: 'Sensaciones frías',       nombre_en: 'Cold sensations' },
  'sensaciones_calidas':   { color: '#E8935A', nombre: 'Sensaciones cálidas',     nombre_en: 'Warm sensations' },
  'sonido':                { color: '#6BBF8A', nombre: 'Sonido / acústica',       nombre_en: 'Sound / acoustics' },
  'aromas':                { color: '#E8E0D4', nombre: 'Aromas / olores',         nombre_en: 'Aromas / smells' },
  'violencia_sexual':      { color: '#B814E8', nombre: 'Violencia sexual',        nombre_en: 'Sexual violence' },
  'placer_deseo':          { color: '#FF2D8A', nombre: 'Placer / deseo',          nombre_en: 'Pleasure / desire' },
  'profesional_hombre':    { color: '#4A7BAF', nombre: 'Profesional hombre',      nombre_en: 'Male professional' },
  'profesional_mujer':     { color: '#F5DD2C', nombre: 'Profesional mujer',       nombre_en: 'Female professional' },
  'artefactos_procedimientos': { color: '#7C8A99', nombre: 'Artefactos / procedimientos', nombre_en: 'Artifacts / procedures' },
  'emergentes':            { color: '#9A8CFF', nombre: 'Emergentes',              nombre_en: 'Emergent' }
};

const IDIOMA_PAGINA = parametros.get('idioma') === 'en' ? 'en' : 'es';
const ETIQUETAS = {
  es: { imagenes: 'IMÁGENES', creacion: 'EN CREACIÓN', vacio: 'las imágenes aparecerán aquí a medida que se generen',
        anterior: 'anterior', siguiente: 'siguiente', cerrar: 'cerrar', alt: 'Imagen generada a partir de un relato', cargando: 'cargando relato' },
  en: { imagenes: 'IMAGES', creacion: 'IN PROGRESS', vacio: 'images will appear here as they are generated',
        anterior: 'previous', siguiente: 'next', cerrar: 'close', alt: 'Image generated from a story', cargando: 'loading story' }
}[IDIOMA_PAGINA];
document.documentElement.lang = IDIOMA_PAGINA;
document.getElementById('etiqueta-imagenes').textContent = ETIQUETAS.imagenes;
document.getElementById('etiqueta-creacion').textContent = ETIQUETAS.creacion;
document.getElementById('vacio').textContent = ETIQUETAS.vacio;
document.getElementById('anterior').textContent = ETIQUETAS.anterior;
document.getElementById('siguiente').textContent = ETIQUETAS.siguiente;
document.getElementById('cerrar').textContent = ETIQUETAS.cerrar;

// Texto oscuro sobre los colores claros (Aromas, Profesional mujer), claro sobre el resto.
function colorTextoChip(color) {
  const c = String(color).trim();
  let rgb = null;
  const hex = c.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  const fun = c.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/i);
  if (hex) rgb = hex.slice(1, 4).map(v => parseInt(v, 16));
  else if (fun) rgb = fun.slice(1, 4).map(Number);
  if (!rgb) return '#fff';
  const luz = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
  return luz > 170 ? '#111' : '#fff';
}

function nombreCategoria(cat, idioma) {
  const info = CATEGORIAS[cat];
  if (!info) return cat;
  return idioma === 'en' ? info.nombre_en : info.nombre;
}

// ---------- grilla ----------
const grilla = document.getElementById('grilla');
const vacio = document.getElementById('vacio');
const nImagenes = document.getElementById('n-imagenes');
const enCreacion = document.getElementById('en-creacion');
const nCreacion = document.getElementById('n-creacion');
let imagenes = [];               // más nuevas primero
const celdas = new Map();        // id -> elemento
let primeraCarga = true;
let totalMostrado = null;
const ANCHO_MINIATURA = (window.devicePixelRatio || 1) > 1.5 ? 384 : 256;

function crearCelda(img, indice) {
  const b = document.createElement('button');
  b.className = 'celda';
  b.type = 'button';
  b.setAttribute('aria-label', ETIQUETAS.alt);
  const foto = document.createElement('img');
  foto.loading = 'lazy';
  foto.decoding = 'async';
  foto.alt = ETIQUETAS.alt;
  foto.onload = () => foto.classList.add('cargada');
  foto.src = `${API_BASE}${img.url}&ancho=${ANCHO_MINIATURA}`;
  b.appendChild(foto);
  const puntos = document.createElement('div');
  puntos.className = 'puntos';
  for (const color of img.colores || []) {
    const p = document.createElement('span');
    p.className = 'punto';
    p.style.background = color;
    puntos.appendChild(p);
  }
  b.appendChild(puntos);
  b.addEventListener('click', () => abrir(imagenes.findIndex(x => x.id === img.id)));
  return b;
}

async function cargar() {
  let datos;
  try {
    const res = await fetch(`${API_BASE}/imagenes`, { cache: 'no-store' });
    if (!res.ok) return;
    datos = await res.json();
  } catch (e) { return; }
  const lista = (datos.imagenes || []).slice().sort((a, b) => b.respuesta_id - a.respuesta_id);
  const presentes = new Set(lista.map(i => i.id));
  // quitar las que se ocultaron desde la administración
  for (const [id, el] of celdas) {
    if (!presentes.has(id)) { el.remove(); celdas.delete(id); }
  }
  // agregar o actualizar, respetando el orden (más nuevas arriba)
  let anterior = null;
  for (const img of lista) {
    let el = celdas.get(img.id);
    const previa = imagenes.find(x => x.id === img.id);
    if (el && previa && previa.url !== img.url) { el.remove(); el = null; }   // regenerada
    if (!el) {
      el = crearCelda(img);
      if (!primeraCarga) el.classList.add('nueva');
      celdas.set(img.id, el);
    }
    // solo se mueve si no está ya en su lugar (evita reinsertar toda la grilla)
    if (anterior) { if (el.previousElementSibling !== anterior) anterior.after(el); }
    else if (grilla.firstElementChild !== el) grilla.prepend(el);
    anterior = el;
  }
  imagenes = lista;
  primeraCarga = false;
  vacio.style.display = lista.length ? 'none' : 'block';
  const total = lista.length;
  if (totalMostrado !== null && total > totalMostrado) {
    nImagenes.classList.add('sube');
    setTimeout(() => nImagenes.classList.remove('sube'), 400);
  }
  totalMostrado = total;
  nImagenes.textContent = total;
  const creando = (datos.pendientes || 0) + (datos.generando || 0);
  nCreacion.textContent = creando;
  enCreacion.classList.toggle('visible', creando > 0);
}

// ---------- imagen y relato ----------
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modal-img');
const modalRelato = document.getElementById('modal-relato');
const modalCats = document.getElementById('modal-cats');
const botonTraducir = document.getElementById('modal-traducir');
const TEXTOS_TRADUCCION = {
  en: { ver: 'see in English', original: 'ver original', cargando: 'translating...', error: 'translation unavailable' },
  es: { ver: 'ver en español', original: 'see original', cargando: 'traduciendo...', error: 'traducción no disponible' }
};
let indiceActual = -1;
let relatoActual = null;   // {id, original, idioma, destino, traducciones, categorias, mostrandoTraduccion}
let traduciendo = false;

function pintarChips() {
  if (!relatoActual) return;
  const idioma = relatoActual.mostrandoTraduccion ? relatoActual.destino : relatoActual.idioma;
  modalCats.innerHTML = '';
  for (const cat of relatoActual.categorias) {
    const chip = document.createElement('span');
    chip.className = 'modal-cat-chip';
    chip.style.background = (CATEGORIAS[cat] || { color: '#888' }).color;
    chip.style.color = colorTextoChip(chip.style.background);
    chip.textContent = nombreCategoria(cat, idioma);
    modalCats.appendChild(chip);
  }
}

function textoBotonTraduccion() {
  const t = TEXTOS_TRADUCCION[relatoActual.destino];
  return relatoActual.mostrandoTraduccion ? t.original : t.ver;
}

async function abrir(indice) {
  if (indice < 0 || indice >= imagenes.length) return;
  indiceActual = indice;
  const img = imagenes[indice];
  modalImg.src = `${API_BASE}${img.url}`;
  modalImg.alt = ETIQUETAS.alt;
  relatoActual = null;
  modalCats.innerHTML = '';
  modalRelato.textContent = ETIQUETAS.cargando;
  modalRelato.classList.add('cargando');
  botonTraducir.style.display = 'none';
  modal.classList.add('activo');
  document.body.style.overflow = 'hidden';
  const pedido = img.respuesta_id;
  try {
    const res = await fetch(`${API_BASE}/relato/${pedido}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (indiceActual !== indice) return;          // ya se pasó a otra imagen
    const idioma = data.idioma === 'en' ? 'en' : 'es';
    const cats = data.categorias_activadas || img.categorias || [];
    relatoActual = {
      id: pedido, original: data.relato || '', idioma, destino: idioma === 'en' ? 'es' : 'en',
      traducciones: data.traducciones || {}, mostrandoTraduccion: false,
      categorias: Array.isArray(cats) ? cats : Object.keys(cats),
    };
    modalRelato.textContent = relatoActual.original;
    modalRelato.classList.remove('cargando');
    botonTraducir.textContent = textoBotonTraduccion();
    botonTraducir.disabled = false;
    botonTraducir.style.display = relatoActual.original ? 'block' : 'none';
    pintarChips();
  } catch (e) {
    if (indiceActual === indice) modalRelato.textContent = '';
  }
}

async function alternarTraduccion() {
  if (!relatoActual || traduciendo) return;
  const r = relatoActual;
  if (r.mostrandoTraduccion) {
    modalRelato.textContent = r.original;
    r.mostrandoTraduccion = false;
    botonTraducir.textContent = textoBotonTraduccion();
    pintarChips();
    return;
  }
  if (r.traducciones[r.destino]) {
    modalRelato.textContent = r.traducciones[r.destino];
    r.mostrandoTraduccion = true;
    botonTraducir.textContent = textoBotonTraduccion();
    pintarChips();
    return;
  }
  traduciendo = true;
  botonTraducir.disabled = true;
  botonTraducir.textContent = TEXTOS_TRADUCCION[r.destino].cargando;
  let texto = null;
  try {
    const res = await fetch(`${API_BASE}/traducir/${r.id}?a=${r.destino}`, { method: 'POST' });
    if (res.ok) texto = (await res.json()).texto || null;
  } catch (e) { /* se informa abajo */ }
  traduciendo = false;
  botonTraducir.disabled = false;
  if (relatoActual !== r) return;     // se cerró o se cambió de imagen
  if (texto) {
    r.traducciones[r.destino] = texto;
    modalRelato.textContent = texto;
    r.mostrandoTraduccion = true;
    botonTraducir.textContent = textoBotonTraduccion();
    pintarChips();
  } else {
    botonTraducir.textContent = TEXTOS_TRADUCCION[r.destino].error;
    setTimeout(() => { if (relatoActual === r && !r.mostrandoTraduccion) botonTraducir.textContent = textoBotonTraduccion(); }, 2500);
  }
}

function cerrar() {
  modal.classList.remove('activo');
  document.body.style.overflow = '';
  indiceActual = -1;
  relatoActual = null;
  modalImg.removeAttribute('src');
}

function mover(paso) {
  if (indiceActual < 0 || !imagenes.length) return;
  abrir((indiceActual + paso + imagenes.length) % imagenes.length);
}

botonTraducir.addEventListener('click', alternarTraduccion);
document.getElementById('cerrar').addEventListener('click', cerrar);
document.getElementById('anterior').addEventListener('click', () => mover(-1));
document.getElementById('siguiente').addEventListener('click', () => mover(1));
modal.addEventListener('click', (e) => { if (e.target === modal) cerrar(); });
document.addEventListener('keydown', (e) => {
  if (!modal.classList.contains('activo')) return;
  if (e.key === 'Escape') cerrar();
  else if (e.key === 'ArrowLeft') mover(-1);
  else if (e.key === 'ArrowRight') mover(1);
});

cargar();
setInterval(cargar, SONDEO_MS);
</script>
</body>
</html>
